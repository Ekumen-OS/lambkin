name: uv-lock-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  uv-lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check if uv.lock is up to date
        run: uv lock --check
