name: pytest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --group dev

      - name: Run pytest in podman
        run: |
          podman run --rm \
            --systemd=always \
            -v ${{ github.workspace }}:/workspace:z \
            -w /workspace \
            python:3.12 \
            bash -c "pip install uv && uv sync --group dev && uv run pytest"
