[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[project]
name = "lambkin"
version = "0.0.0"
description = "A programmatic SLAM benchmarking SDK."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Teresa Ortega", email = "teresa.ortega0903@gmail.com>"},
    {name = "Xavier Ruiz", email = "xavier.ruiz@ekumenlabs.com>"}
]
keywords = ["robotics", "benchmarking", "SLAM", "localization", "ROS 2"]
dependencies = [
    "evo>=1.34.3",
    "pydantic>=2.0",
    "click>=8.3.0",
]

[project.urls]
Repository = "https://github.com/Ekumen-OS/lambkin"

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "mypy>=1.19.1",
    "pytest>=8.0",
    "pytest-repeat>=0.9.3",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.mypy]
# TODO(xaru8145): set sctrict to true
strict = false
python_version = "3.10"
files = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
preview = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "DOC", "N", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = [".",
             "examples", "src"]

[project.scripts]
lambkin = "lambkin.cli:main"
