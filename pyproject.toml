[build-system]
requires = ["uv-build>=0.10.0"]
build-backend = "uv_build"

[project]
name = "lambkin"
version = "0.0.0"
description = "A programmatic SLAM benchmarking SDK."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "evo>=1.34.3",
    "pydantic>=2.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.15.0",
    "mypy>=1.15.0",
    "pytest>=8.0",
]

[tool.uv.build]
source-trees = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "N", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"