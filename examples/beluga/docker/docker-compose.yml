services:

  lambkin_dev:
    build:
      context: ../../..
      dockerfile: examples/beluga/docker/Dockerfile
      target: development
    image: lambkin_ros_dev:jazzy
    container_name: lambkin_developer
    network_mode: "host"
    stdin_open: true
    tty: true
    profiles: ["development"]
    volumes:
      - ../../..:/ws
      # ── Inputs (uncomment and adjust paths as needed) ─────────
      # - /path/to/your/rosbag:/data/rosbag
      # - /path/to/your/map:/data/map
      # - /path/to/your/groundtruth:/data/groundtruth
      # ── Output (benchmark results persisted on host) ──────────
      # - ../benchmarks:/ws/examples/beluga/benchmarks

  lambkin_prod:
    build:
      context: ../../..
      dockerfile: examples/beluga/docker/Dockerfile
      target: production
    image: lambkin_ros:jazzy
    container_name: lambkin_production
    network_mode: "host"
    stdin_open: true
    tty: true
    profiles: ["production"]
    volumes:
      # ── Inputs (uncomment and adjust paths as needed) ─────────
      # - /path/to/your/rosbag:/data/rosbag
      # - /path/to/your/map:/data/map
      # - /path/to/your/groundtruth:/data/groundtruth
      # ── Output (benchmark results persisted on host) ──────────
      # - ../benchmarks:/ws/examples/beluga/benchmarks
